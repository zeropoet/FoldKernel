name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Swift toolchain
        uses: swift-actions/setup-swift@7591e4f04c00624cb043783da51a7fd6ee0a6bf6 # v2
        with:
          swift-version: "6.1.2"
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Verify developer preview
        run: Scripts/verify-developer-preview.sh
      - name: Build release configuration
        run: swift build -c release
