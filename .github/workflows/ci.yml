name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Swift toolchain
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.1.2"
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Verify developer preview
        run: Scripts/verify-developer-preview.sh
      - name: Verify integration-contract schema
        run: python3 -m json.tool Integration/foldkernel-integration.schema.json >/dev/null
      - name: Validate relation-weight schema and vector independently
        run: |
          python3 -m venv /tmp/foldkernel-vector-env
          /tmp/foldkernel-vector-env/bin/pip install jsonschema==4.23.0 pycryptodome==3.23.0
          /tmp/foldkernel-vector-env/bin/python Scripts/verify-relation-vector.py
      - name: Build release configuration
        run: swift build -c release

  swift-59:
    runs-on: ubuntu-24.04
    container: swift:5.9-jammy
    steps:
      - uses: actions/checkout@v7
      - name: Build public library and executables with Swift 5.9
        run: swift build -c release
